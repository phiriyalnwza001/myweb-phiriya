<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ชื่อตัวเอง</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      font-family: 'Segoe UI', 'Kanit', Tahoma, sans-serif;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      max-width: 360px;
      width: 100%;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .image-container {
      width: 280px;
      height: 280px;
      margin: 0 auto 28px;
      border-radius: 20px;
      overflow: hidden;
      border: 4px solid #f8b4c4;
      box-shadow: 0 10px 25px rgba(248, 180, 196, 0.45);
      background: #f0f0f0;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      image-rendering: pixelated;
    }

    h1 {
      color: #4a4a4a;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 8px;
      color: #999;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="image-container">
      <!-- วางไฟล์รูปภาพชื่อ image.png ไว้ในโฟลเดอร์เดียวกับไฟล์นี้ -->
      <img src="ChatGPT Image 21 ก.ค. 2569 10_29_10.png" alt="รูปภาพของชื่อตัวเอง">
    </div>
    <h1>ชื่อ นาย พิริยะ ปุ่มไม้ เลขที่10 ปวช.2/10</h1>
    <p class="subtitle">ยินดีต้อนรับสู่เว็บไซต์ของฉัน</p>
  </div>
</body>
</html>
